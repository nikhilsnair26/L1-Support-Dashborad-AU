  #sidebar{

  #sidebar .brand{ padding:22px 20px 16px 20px; border-bottom:1px solid var(--line); }

  #sidebar .brand .logo .mark{ width:26px; height:26px; border-radius:6px; background:var(--blue); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--mono); font-weight:700; font-size:13px; }
  #sidebar .brand .k{ font-family:var(--mono); font-size:10px; letter-spacing:0.07em; color:var(--blue); font-weight:600; }
  #sidebar .brand .t{ font-size:16px; font-weight:700; margin-top:8px; line-height:1.3; color:var(--text); }
  #sidebar .brand .s{ font-size:11.5px; color:var(--muted); margin-top:3px; }

  #navlist{ list-style:none; margin:0; padding:10px 0; flex:1; }
  #navlist button{
    width:100%; text-align:left; background:none; border:none; color:var(--muted);
    padding:10px 20px; font-size:13.5px; font-family:var(--sans); cursor:pointer;
    border-left:3px solid transparent; transition:background 0.12s, color 0.12s;
  }
  #navlist button:hover{ background:var(--blue-light); color:var(--text); }
  #navlist button.active{ background:var(--blue-light); color:var(--blue-dark); border-left:3px solid var(--blue); font-weight:600; }

  #sidebar .foot{ padding:14px 20px 18px 20px; border-top:1px solid var(--line); font-size:10.5px; color:var(--dim); line-height:1.6; font-family:var(--mono); }

  #main{ flex:1; min-width:0; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between; padding:20px 36px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(244,247,252,0.92); backdrop-filter:blur(6px); z-index:5;

  #topbar .sub{ font-size:12.5px; color:var(--muted); margin-top:3px; }
  #topbar .period{ font-family:var(--mono); font-size:11px; color:var(--blue); background:var(--blue-light); padding:5px 11px; border-radius:3px; white-space:nowrap; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  h2.pt{ font-size:22px; margin:0 0 6px 0; font-weight:700; }
  p.desc{ font-size:13px; color:var(--muted); margin:0 0 22px 0; max-width:800px; line-height:1.55; }

  /* Stat cards */
  .statgrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:28px; border-radius:8px; overflow:hidden; }
  .stat{ background:var(--panel); padding:18px 18px 16px 18px; border-top:3px solid var(--dim); }
  .stat.ok{ border-top-color:var(--green); }
  .stat.warn{ border-top-color:var(--amber); }
  .stat.bad{ border-top-color:var(--red); }
  .stat .label{ font-size:11px; color:var(--muted); margin-bottom:8px; font-weight:600; }
  .stat .value{ font-family:var(--mono); font-size:25px; font-weight:700; line-height:1; color:var(--text); }
  .stat .flag{ font-size:11px; margin-top:9px; color:var(--muted); line-height:1.4; }

  .section-note{ font-size:12px; color:var(--muted); margin:-6px 0 14px 0; line-height:1.5; }

  .scroll-x{ overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  table.grid{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.grid th{
    background:var(--panel-2); color:var(--blue-dark); text-align:left; font-weight:700; font-size:10.5px;
    letter-spacing:0.02em; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;

  table.grid tr:last-child td{ border-bottom:none; }
  table.grid tr:hover td{ background:var(--panel-2); }
  td.num{ font-family:var(--mono); }
  td.rowlabel{ font-weight:700; white-space:nowrap; }

  .badge.Low{ background:rgba(15,157,107,0.12); color:var(--green); }
  .badge.Medium{ background:rgba(199,131,10,0.12); color:var(--amber); }
  .badge.High{ background:rgba(216,67,58,0.12); color:var(--red); }
  .badge.Critical{ background:rgba(216,67,58,0.22); color:var(--red); font-weight:800; }

  /* Key-value blocks */
  .kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }

  .kv-item .l{ font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600; }

  .plain-list li:last-child{ border-bottom:none; }
  .plain-list b{ color:var(--text); }

  .legend .li{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); font-family:var(--mono); }

</style>

/* ================= HELPERS ================= */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return (s==null?"":String(s)); }
function td(text, cls){ return el("td",cls,esc(text)); }
function riskBadge(level){ return `<span class="badge ${level}">${level}</span>`; }
function table(headers, rows){
  const wrap = el("div","scroll-x");
  const t = el("table","grid");
  const thead = el("thead");
  const htr = el("tr");
  headers.forEach(h=>htr.appendChild(el("th",null,h)));
  thead.appendChild(htr); t.appendChild(thead);
  const tbody = el("tbody");
  rows.forEach(r=>tbody.appendChild(r));
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

/* ================= CHARTS (inline SVG) ================= */
function barChartHoriz(items, note){
  const box = el("div","chartbox");
  const max = Math.max(...items.map(i=>i.value));
  const w = 900, rowH = 34, padTop=10, padLeft=90, chartW = w - padLeft - 90;
  const h = padTop*2 + rowH*items.length;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  items.forEach((it,i)=>{
    const y = padTop + i*rowH;
    const bw = (it.value/max) * chartW;
    svg += `<text x="${padLeft-10}" y="${y+rowH/2+4}" text-anchor="end" font-size="12">${it.label}</text>`;
    svg += `<rect x="${padLeft}" y="${y+6}" width="${chartW}" height="${rowH-14}" fill="#EAF1FD"/>`;
    svg += `<rect x="${padLeft}" y="${y+6}" width="${bw}" height="${rowH-14}" fill="#1857C4"/>`;
    svg += `<text x="${padLeft+bw+8}" y="${y+rowH/2+4}" font-size="12" fill="#0F2244">${it.value.toLocaleString()} (${it.sub})</text>`;
  });
  svg += `</svg>`;
  box.innerHTML = svg;
  if(note) box.appendChild(el("div","section-note",note));
  return box;
}

function barChartVertGeneric(items, color){
  const box = el("div","chartbox");
  const max = Math.max(...items.map(i=>i.value));
  const w = 900, h = 200, padBottom=28, padTop=20, gap=10;
  const chartH = h - padBottom - padTop;
  const barW = (w - gap*(items.length-1)) / items.length;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  items.forEach((it,i)=>{
    const x = i*(barW+gap);
    const bh = (it.value/max) * chartH;
    const y = padTop + (chartH - bh);
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${color}"/>`;
    svg += `<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="10.5" fill="#0F2244">${it.value}</text>`;
    svg += `<text x="${x+barW/2}" y="${h-10}" text-anchor="middle" font-size="10">${it.label}</text>`;
  });
  svg += `</svg>`;
  box.innerHTML = svg;
  return box;
}

function lineChartPct(labels, series){
  const box = el("div","chartbox");
  const w = 900, h = 240, padL=40, padR=16, padT=16, padB=30;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const allVals = series.flatMap(s=>s.values);
  const max = Math.max(...allVals, 10);
  const stepX = chartW/(labels.length-1);
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  for(let g=0; g<=4; g++){
    const y = padT + chartH - (g/4)*chartH;
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#EAF1FD" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10">${Math.round((g/4)*max)}%</text>`;
  }
  labels.forEach((lb,i)=>{
    const x = padL + i*stepX;
    svg += `<text x="${x}" y="${h-10}" text-anchor="middle" font-size="9.5">${lb.replace("Week ","W")}</text>`;
  });
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>[padL+i*stepX, padT+chartH-(v/max)*chartH]);
    const pathD = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    svg += `<path d="${pathD}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    pts.forEach(p=>{ svg += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${s.color}"/>`; });
  });
  svg += `</svg>`;
  box.innerHTML = svg;
  const legend = el("div","legend");
  series.forEach(s=>{
    const li = el("div","li");
    li.innerHTML = `<span class="sw" style="background:${s.color}"></span>${s.name}`;
    legend.appendChild(li);
  });
  box.appendChild(legend);
  return box;
}

function lineChartIndexed(series){
  const box = el("div","chartbox");
  const w = 900, h = 260, padL=36, padR=16, padT=16, padB=30;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const maxLen = Math.max(...series.map(s=>s.values.length));
  const allVals = series.flatMap(s=>s.values).filter(v=>v!=null);
  const max = Math.max(...allVals);
  const stepX = chartW/(maxLen-1);
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  for(let g=0; g<=4; g++){
    const y = padT + chartH - (g/4)*chartH;
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#EAF1FD" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10">${Math.round((g/4)*max)}</text>`;
  }
  for(let i=0;i<maxLen;i++){
    const x = padL + i*stepX;
    svg += `<text x="${x}" y="${h-10}" text-anchor="middle" font-size="10">${i+1}</text>`;
  }
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>[padL+i*stepX, padT+chartH-(v/max)*chartH]);
    const pathD = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    svg += `<path d="${pathD}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    pts.forEach(p=>{ svg += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${s.color}"/>`; });
  });
  svg += `</svg>`;
  box.innerHTML = svg;
  const legend = el("div","legend");
  series.forEach(s=>{
    const li = el("div","li");
    li.innerHTML = `<span class="sw" style="background:${s.color}"></span>${s.agent}`;
    legend.appendChild(li);
  });
  box.appendChild(legend);
  return box;
}

/* ================= NAV ================= */
const RENDERERS = {
  overview: renderOverview, trend: renderTrend, capability: renderCapability,
  scorecard: renderScorecard, rota: renderRota, whatsapp: renderWhatsapp, sla: renderSla,
  validation: renderValidation, agentperf: renderAgentPerf,
};

function renderNav(){
  const ul = document.getElementById("navlist");
  SECTIONS.forEach(s=>{
    const li = el("li");
    const btn = el("button", null, s.name);
    btn.dataset.id = s.id;
    btn.onclick = ()=>showPanel(s.id);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function showPanel(id){
  document.querySelectorAll("#navlist button").forEach(b=>b.classList.toggle("active", b.dataset.id===id));
  const s = SECTIONS.find(x=>x.id===id);
  document.getElementById("pagetitle").textContent = s.name;
  document.getElementById("pagesub").textContent = SUBTITLES[id] || "";
  const content = document.getElementById("content");
  content.innerHTML = "";
  const panel = el("div","panel active");
  content.appendChild(panel);
  RENDERERS[id](panel);
  location.hash = id;
}

renderNav();
showPanel((location.hash||"").replace("#","") || "overview");
